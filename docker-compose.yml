#
# Hardened Joey deployment for Hermes Agent.
#
# Prerequisite: hermes-credential-runtime.service must be active. It exposes
# the 1Password bootstrap and writable runtime credentials from a protected,
# non-swappable tmpfs. No plaintext credential is supplied through Compose or
# Docker metadata.
#
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: .
    image: hermes-agent:js-dashboard-hardened
    container_name: hermes
    restart: unless-stopped
    cpus: 3.0
    mem_limit: 6g
    mem_reservation: 2g
    pids_limit: 2048
    ulimits:
      core: 0
    network_mode: host
    depends_on:
      op-connect-api:
        condition: service_started
    volumes:
      - /home/hermes/.hermes:/opt/data
      - /run/hermes-runtime:/run/hermes-runtime
      - /run/hermes-runtime/bootstrap/op-service-account-token:/run/secrets/hermes-op-service-account-token:ro
      - type: bind
        source: /run/hermes-runtime/bootstrap/op-connect-token
        target: /run/secrets/hermes-op-connect-token
        read_only: true
        bind:
          create_host_path: false
    logging: *default-logging
    environment:
      - HERMES_UID=${HERMES_UID:?HERMES_UID is required; use start-dashboard.sh}
      - HERMES_GID=${HERMES_GID:?HERMES_GID is required; use start-dashboard.sh}
      - HERMES_OP_SERVICE_ACCOUNT_TOKEN_FILE=/run/secrets/hermes-op-service-account-token
      - OP_CONNECT_HOST=http://127.0.0.1:8080
      - HERMES_OP_CONNECT_TOKEN_FILE=/run/secrets/hermes-op-connect-token
      - HERMES_SECRET_ENV_ALLOWLIST=MCP_GITHUB_API_KEY,DEEPGRAM_API_KEY
    command: ["gateway", "run"]

  # Dedicated, profile-scoped Chromium endpoint for the Samudio Agency
  # executive assistant. CDP listens on loopback only.
  executive-assistant-browser:
    image: hermes-agent:js-dashboard-hardened
    container_name: hermes-executive-assistant-browser
    restart: unless-stopped
    network_mode: host
    user: "${HERMES_UID:?HERMES_UID is required}:${HERMES_GID:?HERMES_GID is required}"
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 512
    shm_size: 256m
    ulimits:
      core: 0
    volumes:
      - /home/hermes/.hermes:/opt/data
    logging: *default-logging
    environment:
      - HOME=/opt/data/profiles/agency/browser
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec /opt/data/browser-binaries/chromium-current/chrome-linux64/chrome
        --headless=new
        --no-sandbox
        --disable-dev-shm-usage
        --password-store=basic
        --remote-debugging-address=127.0.0.1
        --remote-debugging-port=9223
        --user-data-dir=/opt/data/profiles/agency/browser/chromium
        --no-first-run
        --no-default-browser-check
        about:blank

  dashboard:
    image: hermes-agent:js-dashboard-hardened
    container_name: hermes-dashboard
    # Bound restart count prevents a bad credential or a 1Password rate limit
    # from creating a provider-read restart storm.
    restart: "on-failure:3"
    network_mode: host
    depends_on:
      - gateway
    ulimits:
      core: 0
    volumes:
      - /home/hermes/.hermes:/opt/data
      - /run/hermes-runtime/bootstrap/op-service-account-token:/run/secrets/hermes-op-service-account-token:ro
      - type: bind
        source: /run/hermes-runtime/bootstrap/op-connect-token
        target: /run/secrets/hermes-op-connect-token
        read_only: true
        bind:
          create_host_path: false
    logging: *default-logging
    environment:
      - HERMES_UID=${HERMES_UID:?HERMES_UID is required; use start-dashboard.sh}
      - HERMES_GID=${HERMES_GID:?HERMES_GID is required; use start-dashboard.sh}
      - HERMES_OP_SERVICE_ACCOUNT_TOKEN_FILE=/run/secrets/hermes-op-service-account-token
      - OP_CONNECT_HOST=http://127.0.0.1:8080
      - HERMES_OP_CONNECT_TOKEN_FILE=/run/secrets/hermes-op-connect-token
      - HERMES_SECRET_ENV_ALLOWLIST=HERMES_DASHBOARD_OIDC_CLIENT_ID,HERMES_DASHBOARD_OIDC_CLIENT_SECRET
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
    entrypoint: ["/opt/hermes/docker/onepassword-entrypoint.sh"]

  op-connect-api:
    image: 1password/connect-api:1.8.2@sha256:e915c0c843972f02b0e7e2de502bda8bd4a092288b3f1866098a857bd715a281
    container_name: hermes-op-connect-api
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    ulimits:
      core: 0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      op-connect-sync:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    networks: ["op-connect-bus"]
    environment:
      - OP_SESSION=/home/opuser/.op/1password-credentials.json
      - OP_BUS_PORT=11223
      - OP_BUS_PEERS=op-connect-sync:11223
      - OP_LOG_LEVEL=info
    volumes:
      - type: bind
        source: /run/hermes-runtime/bootstrap/op-connect-credentials
        target: /home/opuser/.op/1password-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: op_connect_data
        target: /home/opuser/.op/data
    logging: *default-logging

  op-connect-sync:
    image: 1password/connect-sync:1.8.2@sha256:6297ca6136c0f0fb096bc64c49e1bc8df2aab35282ebff8c7bb60745ef176d0d
    container_name: hermes-op-connect-sync
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    ulimits:
      core: 0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["op-connect-bus", "op-connect-egress"]
    environment:
      - OP_SESSION=/home/opuser/.op/1password-credentials.json
      - OP_BUS_PORT=11223
      - OP_BUS_PEERS=op-connect-api:11223
      - OP_LOG_LEVEL=info
    volumes:
      - type: bind
        source: /run/hermes-runtime/bootstrap/op-connect-credentials
        target: /home/opuser/.op/1password-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: op_connect_data
        target: /home/opuser/.op/data
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: hermes-caddy
    restart: unless-stopped
    ulimits:
      core: 0
    network_mode: host
    depends_on:
      - dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

networks:
  op-connect-bus:
    internal: true
  op-connect-egress: {}

volumes:
  op_connect_data:
  caddy_data:
  caddy_config:
