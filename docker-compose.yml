#
# Hardened Joey deployment for Hermes Agent.
#
# Prerequisite: hermes-credential-runtime.service must be active. It exposes
# the 1Password bootstrap and writable runtime credentials from a protected,
# non-swappable tmpfs. No plaintext credential is supplied through Compose or
# Docker metadata.
#
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build:
      context: .
      dockerfile: deployment/direct-secrets/Dockerfile
    image: hermes-agent:direct-secrets-v1
    container_name: hermes
    restart: unless-stopped
    # Sized for the 16 GiB host with explicit headroom for Docker and the OS.
    # Heavy native builds should still be serialized to reduce latency and I/O pressure.
    cpus: 3.0
    mem_limit: 8g
    mem_reservation: 4g
    memswap_limit: 8960m
    pids_limit: 1024
    ulimits:
      core: 0
    network_mode: host
    volumes:
      - /home/hermes/.hermes:/opt/data
      # Keep legacy /opt/data symlinks working while mounting the boot-time
      # 1Password snapshot directly into Hermes. The service-account token is
      # never mounted; these are read-only RAM files only.
      - type: bind
        source: /run/hermes-runtime/.env
        target: /run/hermes-runtime/.env
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/auth.json
        target: /run/hermes-runtime/auth.json
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/mcp-tokens
        target: /run/hermes-runtime/mcp-tokens
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/profiles
        target: /run/hermes-runtime/profiles
        read_only: false
        bind:
          create_host_path: false
      # The whole Codex home is host-backed non-swappable tmpfs. This keeps
      # OAuth refresh, temp files, and atomic replacement off persistent HOME.
      - type: bind
        source: /run/hermes-runtime/codex
        target: /run/hermes-runtime/codex
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/github/token
        target: /run/secrets/github-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/devops/digitalocean-token
        target: /run/secrets/digitalocean-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/devops/ssh-private-key
        target: /run/secrets/ssh-private-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/agency/logins.json
        target: /run/secrets/agency-logins.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/hermes-secure/devops-broker-state/known_hosts
        target: /run/secrets/ssh-known-hosts
        read_only: false
        bind:
          create_host_path: false
      - /home/hermes/.hermes/hermes-connect-rollout-20260724:/opt/data/hermes-connect-rollout-20260724:ro
    tmpfs:
      - /run/hermes-runtime:rw,nosuid,nodev,noexec,size=64k,mode=0700,uid=1000,gid=1000
    logging: *default-logging
    environment:
      - HERMES_UID=${HERMES_UID:?HERMES_UID is required; use start-dashboard.sh}
      - HERMES_GID=${HERMES_GID:?HERMES_GID is required; use start-dashboard.sh}
      - HERMES_GITHUB_TOKEN_FILE=/run/secrets/github-token
      - HERMES_DIGITALOCEAN_TOKEN_FILE=/run/secrets/digitalocean-token
      - HERMES_SSH_PRIVATE_KEY_SOURCE_FILE=/run/secrets/ssh-private-key
      - HERMES_SSH_KNOWN_HOSTS_FILE=/run/secrets/ssh-known-hosts
      - HERMES_AGENCY_LOGINS_FILE=/run/secrets/agency-logins.json
      - CODEX_HOME=/run/hermes-runtime/codex
    command: ["gateway", "run"]

  dashboard:
    build:
      context: .
      dockerfile: deployment/dashboard-scoped-secrets/Dockerfile
    image: hermes-dashboard:direct-secrets-v1
    container_name: hermes-dashboard
    # Restart after planned host reboots; bootstrap still fails closed on bad snapshots.
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 1536m
    mem_reservation: 256m
    memswap_limit: 1792m
    pids_limit: 256
    network_mode: host
    depends_on:
      gateway:
        condition: service_started
    ulimits:
      core: 0
    # Keep runtime symlinks traversable by the UID-1000 dashboard process
    # without exposing the gateway runtime. The private tmpfs is otherwise
    # empty; only OAuth state is nested into it. In particular,
    # /run/hermes-runtime/.env and API-key/password material are not mounted.
    tmpfs:
      - /run/hermes-runtime:rw,nosuid,nodev,noexec,size=64k,mode=0700,uid=1000,gid=1000
    volumes:
      - /home/hermes/.hermes:/opt/data
      - type: bind
        source: /opt/hermes-secure/dashboard/config.yaml
        target: /opt/data/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/dashboard/oidc.json
        target: /run/secrets/dashboard-oidc.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/secrets/current/github/token
        target: /run/secrets/github-token
        read_only: true
        bind:
          create_host_path: false
      # Provider credentials and MCP tokens are OAuth artifacts, not
      # password/API-key material. Mount only the paths that the dashboard's
      # /opt/data symlinks resolve through; do not expose the rest of the
      # gateway runtime directory.
      - type: bind
        source: /run/hermes-runtime/auth.json
        target: /run/hermes-runtime/auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/hermes-runtime/mcp-tokens
        target: /run/hermes-runtime/mcp-tokens
        read_only: false
        bind:
          create_host_path: false
    logging: *default-logging
    environment:
      - HERMES_UID=${HERMES_UID:?HERMES_UID is required; use start-dashboard.sh}
      - HERMES_GID=${HERMES_GID:?HERMES_GID is required; use start-dashboard.sh}
      - HERMES_DASHBOARD_OIDC_FILE=/run/secrets/dashboard-oidc.json
      - HERMES_GITHUB_TOKEN_FILE=/run/secrets/github-token
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: hermes-caddy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 192m
    pids_limit: 128
    ulimits:
      core: 0
    network_mode: host
    depends_on:
      - dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
